# ============================================================
# Enterprise AI DevOps Agent — Security Scanning Pipeline
# Scheduled + manual trigger
# ============================================================

name: Security Scan

on:
  schedule:
    # 每周日凌晨 2:00 运行
    - cron: "0 2 * * 0"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "requirements.txt"
      - "frontend/package.json"
      - "**/Dockerfile"
      - "docker-compose*.yml"

jobs:
  # ============================================================
  # Python dependency CVE scan
  # ============================================================
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true

  # ============================================================
  # Docker image vulnerability scan (Trivy)
  # ============================================================
  trivy:
    name: Docker Image Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: ai-devops-backend:scan

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: ai-devops-frontend:scan

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ai-devops-backend:scan
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ai-devops-frontend:scan
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results-*.sarif
          retention-days: 30

  # ============================================================
  # Secret detection (Gitleaks)
  # ============================================================
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true