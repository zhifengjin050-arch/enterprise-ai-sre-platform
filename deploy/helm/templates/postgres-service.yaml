apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-devops-platform.fullname" . }}-postgres
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}