apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-devops-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-devops-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  siliconflow-api-key: {{ .Values.secrets.siliconflowApiKey | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}