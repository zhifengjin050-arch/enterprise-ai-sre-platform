# =============================================================================
# Enterprise AI DevOps Platform v3.0.0 - Production Helm Values
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
global:
  environment: production

# ---------------------------------------------------------------------------
# Backend configuration
# ---------------------------------------------------------------------------
backend:
  replicaCount: 3

  image:
    repository: ai-devops-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    # LLM Provider
    LLM_PROVIDER: siliconflow
    # SiliconFlow
    SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
    LLM_MODEL: deepseek-ai/DeepSeek-V4-Flash
    VISION_MODEL: Qwen/Qwen3-VL-8B-Instruct
    # Database
    DATABASE_URL: postgresql://devops:$(POSTGRES_PASSWORD)@ai-devops-postgres:5432/devops_agent
    # Redis
    REDIS_URL: redis://ai-devops-redis:6379/0
    # MCP
    ENABLE_MCP: "false"
    # CORS
    CORS_ORIGINS: https://ai-devops.example.com
    # JWT
    JWT_EXPIRE_MINUTES: 1440

  # Additional environment variables (merged with above)
  extraEnv: []

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Service account
  serviceAccount:
    create: false
    name: ""

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# Frontend configuration
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2

  image:
    repository: ai-devops-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # Nginx configuration overrides
  nginx:
    clientMaxBodySize: 50m

  # Backend API URL (injected into frontend config)
  apiUrl: ""

  # Pod annotations
  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ---------------------------------------------------------------------------
# PostgreSQL configuration
# ---------------------------------------------------------------------------
postgres:
  image: postgres:16-alpine

  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # PostgreSQL configuration
  config:
    maxConnections: 200
    sharedBuffers: 256MB

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

# ---------------------------------------------------------------------------
# Redis configuration
# ---------------------------------------------------------------------------
redis:
  image: redis:7-alpine

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Redis configuration
  config:
    maxmemory: 256mb
    maxmemoryPolicy: allkeys-lru

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

# ---------------------------------------------------------------------------
# Ingress configuration
# ---------------------------------------------------------------------------
ingress:
  enabled: true

  # Ingress controller
  className: nginx

  host: ai-devops.example.com

  tls:
    enabled: true
    secretName: ai-devops-tls

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# ---------------------------------------------------------------------------
# Secrets (set via --set or external secret management)
# ---------------------------------------------------------------------------
secrets:
  # LLM API Keys
  siliconflowApiKey: ""
  openaiApiKey: ""
  deepseekApiKey: ""
  # Database
  postgresPassword: "change-me"
  # JWT
  jwtSecret: "change-me-to-a-random-secret"