# ============================================================
# AI 智能运维助手 — 企业演示模式 (Demo)
# 架构: Nginx (Frontend) → Backend (FastAPI) → PostgreSQL
# 演示模式通过 DEMO_MODE=true 启用，不依赖真实服务器
# ============================================================
version: "3.8"

services:
  # ============================================================
  # Database — PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-devops-demo-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_secret
      POSTGRES_DB: devops_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Backend — FastAPI + LangGraph Agent (Demo 模式)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-devops-demo-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=demo
      - DEMO_MODE=true
      - ENABLE_MCP=false
      - DATABASE_URL=postgresql://devops:devops_secret@postgres:5432/devops_agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; import sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops-net
    volumes:
      - logs-volume:/app/logs

  # ============================================================
  # Frontend — Nginx 静态服务器 + API 反向代理
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-devops-demo-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  logs-volume:
    driver: local