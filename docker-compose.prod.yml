# ============================================================
# AI DevOps Assistant v3.0.0 — Production Docker Compose
# Architecture:
#   Nginx (Frontend) → Backend (FastAPI + Gunicorn) → PostgreSQL 16
#   Backend → Redis 7 (Cache / Queue)
#   Backend → Agent → LLM + Tools
#   Prometheus → Backend (/metrics) + Node Exporter
#   Grafana → Prometheus
# ============================================================

services:
  # ============================================================
  # PostgreSQL 16 — 主数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-devops-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_prod_secret}
      POSTGRES_DB: devops_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================
  # Redis 7 — 缓存 / 会话 / 任务队列
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ai-devops-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_prod_pass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_prod_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - devops-prod-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ============================================================
  # Backend — FastAPI + Gunicorn (Production)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-devops-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - ALLOW_REGISTER=false
      - DATABASE_URL=postgresql://devops:${POSTGRES_PASSWORD:-devops_prod_secret}@postgres:5432/devops_agent
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_prod_pass}@redis:6379/0
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:80,http://localhost:8000,https://${DOMAIN:-example.com}
      - PROMETHEUS_PUSH_GATEWAY=http://prometheus:9091
    command: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers ${GUNICORN_WORKERS:-4}
      --bind 0.0.0.0:8000
      --max-requests 10000
      --max-requests-jitter 1000
      --timeout 120
      --keep-alive 5
      --access-logfile /app/logs/access.log
      --error-logfile /app/logs/error.log
      --log-level info
    volumes:
      - logs-volume:/app/logs
    networks:
      - devops-prod-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import httpx; import sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================================
  # Frontend — Nginx (Production Build)
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-devops-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - devops-prod-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================================
  # Prometheus — 指标采集与存储
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - devops-prod-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ============================================================
  # Grafana — 可视化面板
  # ============================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-devops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    networks:
      - devops-prod-net
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  devops-prod-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  logs-volume:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local