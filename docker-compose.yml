# ============================================================
# AI 智能运维助手 — 生产级 Docker 编排
# 架构: Nginx (Frontend) → Backend (FastAPI) → PostgreSQL
#       Backend → Agent → LLM + Tools
#       Prometheus → Backend (/metrics)
#       Grafana → Prometheus
# ============================================================

services:
  # ============================================================
  # Database — PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-devops-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_secret
      POSTGRES_DB: devops_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Backend — FastAPI + LangGraph Agent
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-devops-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://devops:devops_secret@postgres:5432/devops_agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; import sys; sys.exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops-net
    volumes:
      - logs-volume:/app/logs

  # ============================================================
  # Frontend — Nginx 静态服务器 + API 反向代理
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-devops-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devops-net

  # ============================================================
  # Prometheus — 指标采集与存储
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devops-net

  # ============================================================
  # Grafana — 可视化面板
  # ============================================================
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-devops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  logs-volume:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local