<!DOCTYPE html>
<html lang="zh-CN" data-theme="night" data-lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise AI SRE Operations Console</title>
    <script>
      try {
        var t = localStorage.getItem('sre-theme')
        var l = localStorage.getItem('sre-locale')
        if (t === 'day' || t === 'night') {
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t === 'day' ? 'light' : 'dark'
        }
        if (l === 'en' || l === 'zh') {
          document.documentElement.setAttribute('data-lang', l)
          document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en'
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
