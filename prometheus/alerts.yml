# ============================================================
# Prometheus 告警规则 — AI DevOps Agent
# ============================================================
groups:
  - name: devops_alerts
    interval: 30s
    rules:
      - alert: HighCPULoad
        expr: devops_cpu_usage_percent > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU 负载过高 (当前: {{ $value }}%)"

      - alert: HighMemoryUsage
        expr: devops_memory_usage_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "内存使用率过高 (当前: {{ $value }}%)"

      - alert: HighDiskUsage
        expr: devops_disk_usage_percent > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率过高 (当前: {{ $value }}%)"

      - alert: AgentHighErrorRate
        expr: rate(devops_agent_errors_total[5m]) / rate(devops_agent_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent 错误率超过 10%"

      - alert: BackendDown
        expr: up{job="ai-devops-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "后端服务不可达"