# ============================================================
# Enterprise AI DevOps Agent — Ruff Configuration
# ============================================================

target-version = "py312"
line-length = 120

exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    ".venv",
    "frontend",
    "logs",
    "*.egg-info",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "B",
]
ignore = [
    "E501",
    "E731",
    "B008",
    "B904",
    "E402",
    "E712",
    "B011",
    "B905",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841", "N802", "N803", "N806", "B007"]
"scripts/*" = ["F401", "F841", "B007"]

[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
